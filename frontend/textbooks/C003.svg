    <text x="300" y="180" fill="#C79BFF">/IP</text>
  </g>

  <text x="42" y="64" fill="#F3E9FF" font-size="14" letter-spacing="1" opacity="0.92">普通高等教育 · 计算机类精品教材</text>
  <line x1="42" y1="78" x2="300" y2="78" stroke="#F3E9FF" stroke-opacity="0.5" stroke-width="1"/>

  <text x="40" y="250" fill="#FFFFFF" font-size="52" font-weight="800">计算机网络</text>
  <rect x="42" y="276" width="64" height="6" rx="3" fill="#FF7D00"/>
  <text x="42" y="310" fill="#E3CCFF" font-size="18" font-weight="600">自顶向下 · 协议栈与网络安全</text>

  <text x="42" y="500" fill="#F3E9FF" font-size="15" opacity="0.9">课程代码 CS301</text>
  <text x="42" y="528" fill="#FFFFFF" font-size="16" font-weight="600">主编　李　慧</text>
  <text x="42" y="556" fill="#E3CCFF" font-size="13" opacity="0.85">ProgramMind 教育出品 · 高等教育出版社</text>
