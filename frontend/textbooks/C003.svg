<svg xmlns="http://www.w3.org/2000/svg" width="420" height="580" viewBox="0 0 420 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#722ED1"/>
      <stop offset="0.55" stop-color="#531BB0"/>
      <stop offset="1" stop-color="#2E0C66"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.8" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#C79BFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C79BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="420" height="580" fill="url(#bg3)"/>
  <rect x="0" y="0" width="22" height="580" fill="url(#spine3)"/>
  <rect x="0" y="0" width="10" height="580" fill="#000000" opacity="0.18"/>
  <rect x="0" y="0" width="420" height="580" fill="url(#glow3)"/>

  <!-- 装饰：网络拓扑 / 地球经纬 -->
  <g stroke="#E3CCFF" stroke-opacity="0.55" stroke-width="2" fill="none">
    <circle cx="280" cy="430" r="60"/>
    <ellipse cx="280" cy="430" rx="60" ry="22"/>
    <ellipse cx="280" cy="430" rx="26" ry="60"/>
    <line x1="220" y1="430" x2="340" y2="430"/>
  </g>
  <g stroke="#E3CCFF" stroke-opacity="0.5" stroke-width="1.8">
    <line x1="130" y1="470" x2="220" y2="430"/>
    <line x1="340" y1="430" x2="300" y2="500"/>
    <line x1="160" y1="390" x2="220" y2="430"/>
  </g>
  <g fill="#E3CCFF">
    <circle cx="130" cy="470" r="6"/>
    <circle cx="160" cy="390" r="6"/>
    <circle cx="300" cy="500" r="6"/>
    <circle cx="280" cy="430" r="7" fill="#FFFFFF"/>
  </g>
  <g fill="#E3CCFF" fill-opacity="0.85" font-family="monospace" font-size="18">
